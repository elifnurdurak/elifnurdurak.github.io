# Deploy to GitHub Pages.
#
# Purpose: on every push to `main`, run all quality checks, build the static site (`out/`) and
# publish it to GitHub Pages. If any check fails, nothing is published.
#
# Security notes:
#  - Third-party actions are pinned to full commit SHAs (the version is kept in a comment), so a
#    moved or hijacked tag cannot change what runs here.
#  - Permissions are limited to what Pages needs; the build job can only read the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; a newer push cancels an older queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # `npm ci` installs exactly what package-lock.json says (reproducible, no surprise upgrades).
      - name: Install dependencies
        run: npm ci

      # Fails the build if the shipped (production) dependencies have known vulnerabilities.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Runs lint, type check, tests, library.md sync check and the static build.
      - name: Verify and build
        run: npm run verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # verify the deployment source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
